<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2f6fed;
      --card: #f4f5f7;
      --border: #e2e4e8;
      --toggle-bg: #e2e4e8;
    }

    [data-theme="dark"] {
      --bg: #12141a;
      --text: #e8e9ec;
      --muted: #9a9da6;
      --accent: #6d9bff;
      --card: #1d2028;
      --border: #2a2d36;
      --toggle-bg: #2a2d36;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.25s ease, color 0.25s ease;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .theme-toggle {
      border: 1px solid var(--border);
      background: var(--toggle-bg);
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .theme-toggle:hover {
      background: var(--card);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1rem;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      letter-spacing: -0.03em;
    }

    .accent {
      color: var(--accent);
    }

    main p {
      max-width: 34rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .cta {
      margin-top: 1rem;
      display: inline-block;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      padding: 0.7rem 1.6rem;
      border-radius: 8px;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .cta:hover {
      opacity: 0.85;
    }

    footer {
      padding: 1rem 2rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">Hello World</span>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙 Dark</button>
  </header>

  <main>
    <h1>Hello, <span class="accent">World</span></h1>
    <p>
      A minimal one-page site with light and dark mode. It follows your system
      preference by default, and the toggle lets you switch manually — your
      choice is remembered.
    </p>
    <a class="cta" href="#">Get started</a>
  </main>

  <footer>© 2026 Hello World</footer>

  <script>
    (function () {
      var toggle = document.getElementById('theme-toggle');

      function label(theme) {
        toggle.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
      }

      function currentTheme() {
        return document.documentElement.getAttribute('data-theme') || 'light';
      }

      label(currentTheme());

      toggle.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        label(next);
      });

      // Keep following the system preference while the user hasn't chosen manually.
      window.matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', function (e) {
          if (!localStorage.getItem('theme')) {
            var theme = e.matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            label(theme);
          }
        });
    })();
  </script>
</body>
</html>
